name: PHP syntax check

on:
  pull_request:
    branches:
      - redesign/premium-2026
  push:
    branches:
      - redesign/premium-2026

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP 8.3 syntax validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, zip, fileinfo
      - name: Lint all PHP files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' php_files < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)
          if [ ${#php_files[@]} -eq 0 ]; then
            echo 'No PHP files found.'
            exit 1
          fi
          for file in "${php_files[@]}"; do
            echo "Checking $file"
            php -l "$file"
          done
      - name: Run retrieval regression tests
        run: php tests/retrieval-test.php
      - name: Run assistant HTTP and CORS tests
        run: bash tests/assistant-http-test.sh
      - name: Install PDF text extractor
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Run document extraction smoke tests
        run: php tests/document-extract-test.php
